<style>
  :root { --ink:#f5efe6; --muted:#c9bba8; --panel:rgba(24,18,14,.92); --acc:#e0a050; --good:#7fc97f; --bad:#e07060; }

  #cross { position:fixed; left:50%; top:50%; width:8px; height:8px; margin:-4px 0 0 -4px; border-radius:50%; background:rgba(255,255,255,.85); box-shadow:0 0 0 2px rgba(0,0,0,.35); z-index:4; pointer-events:none; transition:transform .1s; }

  #held { position:fixed; left:50%; bottom:calc(14px + env(safe-area-inset-bottom)); transform:translateX(-50%); font-size:13px; color:var(--muted); z-index:4; pointer-events:none; background:rgba(0,0,0,.45); padding:4px 10px; border-radius:8px; display:none; white-space:nowrap; }

  .holo::after { content:""; position:absolute; inset:0; background:linear-gradient(115deg,transparent 20%,rgba(255,120,220,.35) 35%,rgba(120,220,255,.35) 50%,rgba(255,255,140,.3) 65%,transparent 80%); background-size:250% 250%; animation:holo 2.6s linear infinite; mix-blend-mode:screen; pointer-events:none; }

  @keyframes cutp { 50% { opacity:.35; } }

  @keyframes scis { 0%,100% { transform:translateX(0); } 50% { transform:translateX(190px); } }

  .pkstack.out { animation:rise .7s .25s ease-out forwards; pointer-events:auto; }
  @keyframes rise { from { transform:translateY(150px); opacity:0; } 30% { opacity:1; } to { transform:translateY(0); opacity:1; } }

  .pkstack .cardwrap.top { box-shadow:0 0 0 3px rgba(224,160,80,.9), 0 12px 30px rgba(0,0,0,.5); border-radius:10px; animation:nudge 1.4s ease-in-out infinite; }

  S.weather = winter ? (r<0.2?'schnee':r<0.45?'regen':r<0.8?'wolken':'sonne') : summer ? (r<0.5?'sonne':r<0.75?'wolken':'regen') : (r<0.3?'sonne':r<0.65?'wolken':'regen'); if (typeof updateRain==='function') updateRain(); }

function newCard(setId){
  let r = Math.random(), acc = 0, rar = RAR[0];

  const sk = () => clamp(10 - Math.pow(Math.random(),1.8)*5.5, 3, 10);
  const sub = { corners:sk(), edges:sk(), surface:sk(), centering:sk() };

  const set = setId!=null ? setId : Math.floor(Math.random()*SETS.length); let type='kreatur', nm=pick(NAMES); const tr=Math.random();

           seed:Math.floor(Math.random()*1e6), sub, noise, inspected:false, grade:null, status:'inv' };

// Alle Spieler-Aktionen laufen über act(). Solo: sofort ausführen. Später im Koop:
// Host führt aus und verteilt den Zustand, Clients schicken nur ihre Aktion an den Host.
const ACTIONS = {
  use(d){ const t=findTarget(d.tid); if (t && t.use) t.use(); },
  drop(){ dropNow(); }
};
function findTarget(tid){ if (!tid) return null;
  if (tid.startsWith('cust:')){ const c=customers.find(k=>k.uid===tid.slice(5)); if (!c) return null;
    if (c.type==='coffee' && c.state==='wait') return { use:()=>serve(c) };
    if (c.state==='pay' && c.method==='cash') return { use:()=>openChange(c) }; return null; }
  return interactables.find(i=>i.id===tid) || null; }
function withPlayer(pid, fn){ const prev=P; const pl=PLAYERS[pid]; if (!pl) return; P=pl; try { return fn(); } finally { P=prev; } }
function runAction(type, data, pid){ const f=ACTIONS[type]; if (!f) return; withPlayer(pid||LOCAL_ID, ()=>f(data||{}, pid||LOCAL_ID)); }
function act(type, data){ if (Coop.role==='client'){ Coop.send({ t:'act', type, data, pid:LOCAL_ID }); return; } runAction(type, data, LOCAL_ID); }

const Coop = {
  role:'solo',            // 'solo' | 'host' | 'client'
  transport:null,         // später: WebSocket/WebRTC-Adapter mit send(obj) und onmessage
  maxPlayers:4, snapT:0, avatars:{},
  // Transport anschließen (z. B. Coop.attach(new WebSocketAdapter(url)) – siehe KOOP.md)
  attach(t, role){ this.transport=t; this.role=role; t.onmessage=(m)=>this.receive(m); },
  send(msg){ if (this.transport) this.transport.send(msg); },
  receive(m){
    if (m.t==='act' && this.role==='host'){ if (!PLAYERS[m.pid]) this.addPlayer(m.pid); runAction(m.type, m.data, m.pid); }
    else if (m.t==='move' && this.role==='host'){ const pl=PLAYERS[m.pid]||this.addPlayer(m.pid); Object.assign(pl, { x:m.x, z:m.z, yaw:m.yaw, pitch:m.pitch }); }
    else if (m.t==='snap' && this.role==='client') this.applySnapshot(m.snap);
    else if (m.t==='hello' && this.role==='host'){ this.addPlayer(m.pid, m.name); this.send({ t:'snap', snap:this.snapshot() }); }
  },
  addPlayer(pid, name){ if (PLAYERS[pid]) return PLAYERS[pid]; if (Object.keys(PLAYERS).length>=this.maxPlayers) return null;
    const pl={ id:pid, name:name||('Spieler '+(Object.keys(PLAYERS).length+1)), x:-1.2, z:3.0, yaw:0, pitch:0, held:null }; PLAYERS[pid]=pl; return pl; },
  removePlayer(pid){ if (pid===LOCAL_ID) return; delete PLAYERS[pid]; const a=this.avatars[pid]; if (a){ scene.remove(a); delete this.avatars[pid]; } },
  heldChanged(pl){ /* später: Gegenstand in der Hand des Avatars anzeigen */ },
  // Zustand für das Netz (Spielstand + Spieler + sichtbare Kunden)
  snapshot(){ return { S:JSON.parse(JSON.stringify(S)),
    players:Object.values(PLAYERS).map(p=>({ id:p.id, name:p.name, x:p.x, z:p.z, yaw:p.yaw, pitch:p.pitch, held:p.held })),
    customers:customers.filter(c=>c.state!=='gone').map(c=>({ uid:c.uid, hue:c.hue, type:c.type, state:c.state, name:c.name, order:c.order, x:c.g.position.x, z:c.g.position.z, ry:c.g.rotation.y })) }; },
  applySnapshot(sn){ Object.assign(S, sn.S); refreshAllVis();
    sn.players.forEach(p=>{ if (p.id===LOCAL_ID){ LOCALP().held=p.held; return; } const pl=PLAYERS[p.id]||this.addPlayer(p.id,p.name); if (pl) Object.assign(pl,p); });
    Object.keys(PLAYERS).forEach(id=>{ if (!sn.players.some(p=>p.id===id)) this.removePlayer(id); });
    const seen=new Set(); sn.customers.forEach(k=>{ seen.add(k.uid); let c=customers.find(x=>x.uid===k.uid);
      if (!c){ const g=makePerson(k.hue||0.5); scene.add(g); c={ uid:k.uid, g, remote:true }; g.traverse(o=>{ o.userData.customer=c; }); customers.push(c); }
      Object.assign(c,{ type:k.type, state:k.state, name:k.name, order:k.order }); c.tx=k.x; c.tz=k.z; c.g.rotation.y=k.ry; });
    customers.slice().forEach(c=>{ if (c.remote && !seen.has(c.uid)){ scene.remove(c.g); customers.splice(customers.indexOf(c),1); } }); },
  // jedes Bild: Avatare der anderen Spieler zeichnen, Host verteilt 5× pro Sekunde den Zustand
  update(dt){
    if (this.role==='solo') return;
    Object.values(PLAYERS).forEach(pl=>{ if (pl.id===LOCAL_ID) return; let a=this.avatars[pl.id];
      if (!a){ a=makePerson(0.15+0.2*Object.keys(this.avatars).length); scene.add(a); this.avatars[pl.id]=a; }
      const k=Math.min(1,dt*10), px=a.position.x, pz=a.position.z; a.position.x+=(pl.x-px)*k; a.position.z+=(pl.z-pz)*k; a.rotation.y=pl.yaw+Math.PI;
      animWalk(a, performance.now()/1000, Math.hypot(pl.x-px,pl.z-pz)>0.01); });
    if (this.role==='client'){ customers.forEach(c=>{ if (c.remote && c.tx!=null){ c.g.position.x+=(c.tx-c.g.position.x)*Math.min(1,dt*8); c.g.position.z+=(c.tz-c.g.position.z)*Math.min(1,dt*8); } });
      const me=LOCALP(); this.send({ t:'move', pid:LOCAL_ID, x:me.x, z:me.z, yaw:me.yaw, pitch:me.pitch }); }
    if (this.role==='host'){ this.snapT-=dt; if (this.snapT<=0){ this.snapT=0.2; this.send({ t:'snap', snap:this.snapshot() }); } }
  }
};

function checkOrderDeadlines(){ const now=totalMin();
  for (const o of S.orders.slice()){ if (o.status==='gepackt') continue; const age=now-o.at;
    if (o.selfCancelAt && now>=o.selfCancelAt){ cancelOrder(o, `${o.buyer} hat Bestellung #${o.no} storniert („doch anders entschieden“). Kein Ruf-Verlust.`, 0); continue; }
    if (age>=1440 && !o.warned){ o.warned=true; toast(`⏰ Bestellung #${o.no} wartet seit einem Tag. Käufer erwarten Versand innerhalb von 1–2 Werktagen.`,'bad'); }
    if (age>=2880 && !o.lateRoll){ o.lateRoll=true; if (Math.random()<0.6){ cancelOrder(o, `${o.buyer} hat Bestellung #${o.no} storniert: seit 2 Tagen nicht verschickt. Ruf −2`, 2); lateReview(o); continue; } }
    if (age>=4320){ cancelOrder(o, `${o.buyer} hat Bestellung #${o.no} storniert: 3 Tage ohne Versand. Ruf −2`, 2); lateReview(o); } } }
function lateReview(o){ if (Math.random()<0.5){ const t=pick(['Bestellt, bezahlt, nie verschickt. Musste selbst stornieren.','Drei Tage keine Reaktion, schade.','Leider nie versendet worden.']); if (S.reviews.some(r=>r.text===t)) return; S.reviews.unshift({ buyer:o.buyer, stars:1, text:t, no:o.no }); S.reviews=S.reviews.slice(0,40); } }
function cancelOrder(o, msg, repLoss){ if (repLoss==null) repLoss=1; if (S.bench && S.bench.no===o.no){ S.bench=null; if (P.held && (P.held.kind==='supply')) setHeld(null); updateBench(); }
  o.items.forEach(i=>{ if (i.type==='card'){ const c=S.cards.find(k=>k.id===i.cardId); if (c) c.status='online'; } else S.shopListings.boosters.stock += i.qty; });
  o.status='storniert'; S.orders=S.orders.filter(x=>x!==o); S.shopHistory.unshift(o); S.shopHistory=S.shopHistory.slice(0,20); S.rep=Math.max(0,S.rep-repLoss); S.stornos=(S.stornos||0)+1; toast(msg,repLoss?'bad':''); updateLaptopScreen(); save();
}
function updateOnline(dt){
  ensureShop(); updateDeliveries(); checkOrderDeadlines(); updateBoerse(); if (!S.online) return;
  checkOrderDeadlines();
  if (!S.shopOpen) return;
  if (S.nextOrderAt==null) S.nextOrderAt = totalMin()+30;
  if (totalMin() >= S.nextOrderAt) makeOrder(totalMin());
}
function orderRate(atMin){ const h=(atMin/60)%24; if (h<7 || h>=23) return 0; const peak = h>=19 && h<22 ? 1.6 : h>=12 && h<14 ? 1.2 : h<9 ? 0.5 : 1; const avg = S.reviews.length ? S.reviews.reduce((a,r)=>a+r.stars,0)/S.reviews.length : 4; return peak * (0.6 + avg*0.12) * (typeof demandFactor==='function'?demandFactor():1); }
function makeOrder(atMin){
  const r = orderRate(atMin); S.nextOrderAt = atMin + (r>0 ? rnd(35,90)/r : 60); if (r<=0) return;
  const B = S.shopListings.boosters, pool = S.cards.filter(c=>c.status==='online').map(c=>({type:'card',c})); if (B.stock>0) pool.push({type:'booster'});
  if (!pool.length) return;
  const items = [];
  const add = it=>{ if (it.type==='card'){ const c=it.c; if (c.status!=='online') return; if (Math.random() > clamp(1.6-(c.price/cardValue(c))*0.9,0.03,0.9)) return; c.status='ordered'; items.push({type:'card',cardId:c.id,name:c.name,price:c.price,grade:c.grade||0,fake:!!c.fake}); }
    else { if (items.some(i=>i.type==='booster') || B.stock<=0) return; if (Math.random() > clamp(1.55-(B.price/BOOSTER_PRICE)*0.8,0.05,0.85)) return; const q=Math.min(B.stock, 1+Math.floor(Math.random()*(Math.random()<.3?6:3))); B.stock-=q; items.push({type:'booster',qty:q,price:B.price}); } };
  add(pick(pool)); if (items.length && Math.random()<0.3) add(pick(pool));
  if (!items.length) return;
  const o = { no:S.orderNo++, buyer:pick(BUYERS), city:pick(CITIES), items, total:0, status:'neu', at:atMin }; o.total = Math.round(orderTotal(o)*100)/100;
  // Wie in echt: ein kleiner Teil der Käufer storniert von selbst, bevor verschickt wird (Ziel im Handel: unter 3 %)
  if (Math.random()<0.025) o.selfCancelAt = atMin + rnd(15,240);
  o.ship = shipMethod(o);
  S.orders.push(o); toast(`🛒 Neue Bestellung #${o.no} von ${o.buyer}: ${fmt(o.total)}. Am Laptop im Lager annehmen!`,'good'); updateLaptopScreen(); save();
}

async function shareWhatsApp(f, sides, text){
  const waUrl = `https://wa.me/?text=${encodeURIComponent(text)}`;
  // 1) In der fertigen App (Capacitor) oder im normalen Handy-Browser: Bild + Text direkt teilen
  try {
    const cap = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.Share;
    const files=[]; for (const side of sides){ const b=await flyerBlob(f,side); files.push(new File([b],flyerName(f,side),{type:'image/png'})); }
    if (cap && window.Capacitor.Plugins.Filesystem){ const FS=window.Capacitor.Plugins.Filesystem; const uris=[]; for (const fl of files){ const b64=await new Promise(r=>{ const fr=new FileReader(); fr.onload=()=>r(String(fr.result).split(',')[1]); fr.readAsDataURL(fl); }); const w=await FS.writeFile({ path:fl.name, data:b64, directory:'CACHE' }); uris.push(w.uri); } await cap.share({ text, files:uris, dialogTitle:'Mit WhatsApp teilen' }); return; }
    if (navigator.canShare && navigator.canShare({files})){ await navigator.share({ files, text }); return; }
  } catch(e){ if (e && e.name==='AbortError') return; }
  // 2) Sonst WhatsApp direkt mit Text und Link öffnen
  const w = window.open(waUrl, '_blank', 'noopener');
  if (!w){ const a=document.createElement('a'); a.href=waUrl; a.target='_blank'; a.rel='noopener'; document.body.appendChild(a); a.click(); a.remove(); }
  fMsg('WhatsApp wird geöffnet. Das Flyer-Bild direkt mitzuschicken klappt in der fertigen App – hier in der Vorschau geht nur der Text mit Link.');
}

    for (let i=0;i<BINS;i++){ if (!cov[i]) continue; const x0=(i/BINS)*fx.width, x1=((i+1)/BINS)*fx.width; g.strokeStyle='rgba(20,10,5,.85)'; g.lineWidth=5; g.beginPath(); g.moveTo(x0,ly+(i%2?1.5:-1.5)); g.lineTo(x1,ly+(i%2?-1.5:1.5)); g.stroke(); g.strokeStyle='rgba(255,255,255,.9)'; g.lineWidth=1.5; g.beginPath(); g.moveTo(x0,ly+3); g.lineTo(x1,ly+3); g.stroke(); } };

    st.classList.add('torn'); st.style.animation='none'; document.getElementById('packHint').textContent='Ziehe die Karten nacheinander vom Stapel: wischen oder tippen. Die seltenste Karte liegt ganz hinten.'; buildStack(); };

  pk.addEventListener('pointermove',e=>{ if (!cutting||done) return; const [x,y]=pos(e); if (Math.abs(y-lineY())>40){ lastX=null; return; } const a=lastX==null?x:lastX; const lo=Math.min(a,x), hi=Math.max(a,x);
    for (let i=0;i<BINS;i++){ const bx=(i+0.5)/BINS*pk.clientWidth; if (bx>=lo-6 && bx<=hi+6 && !cov[i]){ cov[i]=true; if (Math.random()<0.35) sfx('tapeTick'); } } lastX=x; drawCut(); if (Math.random()<0.3) vib(5); if (cov.filter(Boolean).length>=BINS-3) finishCut(); });

      function land(){ setTimeout(()=>{ el.remove(); el.style.transition='none'; el.style.transform=''; el.style.zIndex=''; const w=document.createElement('div'); w.appendChild(el); const lab=document.createElement('div'); lab.className='rar'; lab.style.color=RAR[c.rar].col; lab.textContent=RAR[c.rar].name; w.appendChild(lab); row.appendChild(w);

    stack.addEventListener('pointerup',end); stack.addEventListener('pointercancel',end); }

function openInventory(tab){

function rangeTxt(c,k){ const v=clamp(c.sub[k]+c.noise[k],1,10); const lo=Math.max(1,Math.floor(v-0.5)), hi=Math.min(10,Math.ceil(v+0.5)); return lo===hi?`${lo}`:`${lo}–${hi}`; }
function estimateText(c){ return `E ${rangeTxt(c,'corners')} · K ${rangeTxt(c,'edges')} · O ${rangeTxt(c,'surface')} · Z ${rangeTxt(c,'centering')}`; }
function estGrade(c){ const vals=['corners','edges','surface','centering'].map(k=>clamp(c.sub[k]+c.noise[k],1,10)); const avg=vals.reduce((a,b)=>a+b,0)/4, mn=Math.min(...vals); const g=clamp(Math.floor(Math.min(avg+0.4,mn+1.6)),1,10); return `${Math.max(1,g-1)} bis ${Math.min(10,g+1)}`; }
function cardAction(a, id){
  const c = S.cards.find(k=>k.id===id); if (!c) return;
  if (a==='lupe') return openLupe(c);
  if (a==='grade'){ c.status='gradebox'; S.gradeBox.push(c.id); toast(`${c.name} liegt in der Grading-Box. Eingeschickt wird gesammelt an der Grading-Station im Lager.`); }
  if (a==='case'){ if (S.showcase.length>=6){ toast('Die Vitrine ist voll.','bad'); return; } c.status='case'; c.price = Math.max(0.5, Math.round(cardValue(c)*1.15*2)/2); S.showcase.push(c.id); updateCase(); }
  if (a==='album'){ putAlbum(c); toast(`${c.name} (${SETS[c.set||0].short} ${c.num}/80) ins Album gesteckt.`); }
  if (a==='schrank'){ if (!S.schrank) S.schrank=[]; if (S.schrank.length>=20){ toast('Der Schrank ist voll.','bad'); return; } c.status='schrank'; c.price=Math.max(0.5,Math.round(cardValue(c)*1.15*2)/2); S.schrank.push(c.id); updateSchrank(); toast(`${c.name} steht für ${fmt(c.price)} im Schrank. Preis änderst du am Schrank.`); }
  if (a==='back'){ c.status='inv'; S.showcase=S.showcase.filter(x=>x!==c.id); updateCase(); }
  if (a==='foto'){ shareSlab(c); return; }
  if (a==='trash'){ S.cards=S.cards.filter(k=>k.id!==c.id); toast(`${c.name} (Fälschung) aussortiert. Fälschungen dürfen nicht verkauft werden.`); }
  if (a==='sell'){ const v=cardValue(c)*0.45; bookIn(v,0.19); S.cards=S.cards.filter(k=>k.id!==c.id); toast(`${c.name} für ${fmt(v)} an den Händler verkauft.`); }
  save(); openInventory();
}

function jumpToOpening(){

  if (S.open) closeShop(); if (P.seat) standUp(); removeAllCustomers();
  const target = S.minute < OPEN_H*60 ? OPEN_H*60 : 24*60 + OPEN_H*60;
  const from = totalMin(), to = (target>=24*60 ? S.day*1440 : (S.day-1)*1440) + OPEN_H*60;
  if (S.online && S.shopOpen) for (let t=from; t<to; t+=20){ if (t>=S.nextOrderAt){ makeOrder(t); } }

}

async function lockOrientation(o){
  try {
    if (o==='auto'){ if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); if (document.fullscreenElement) await document.exitFullscreen(); toast('Ausrichtung: automatisch.'); return; }
    if (!document.fullscreenElement && document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
    await screen.orientation.lock(o==='hoch' ? 'portrait' : 'landscape');
    toast(o==='hoch' ? 'Hochformat gesperrt.' : 'Querformat gesperrt.', 'good');
  } catch(e){ toast(o==='hoch' ? 'Dein Browser erlaubt kein Sperren. Halte das Handy einfach senkrecht – das Spiel ist dafür ausgelegt.' : 'Dein Browser erlaubt kein Sperren. Dreh das Handy einfach quer.'); }
}

let perfAcc=0, perfN=0, perfLow=0;
function perfWatch(dt){ if (mode!=='play' || paused || SET.qManual) return; perfAcc+=dt; perfN++; if (perfAcc<2) return; const fps=perfN/perfAcc; perfAcc=0; perfN=0;
  perfLow = fps<26 ? perfLow+1 : 0;
  if (perfLow>=3 && SET.quality!=='niedrig'){ SET.quality = SET.quality==='hoch' ? 'mittel' : 'niedrig'; perfLow=0; saveSet(); applyQuality(); toast(`Grafik automatisch auf „${SET.quality==='mittel'?'Mittel':'Niedrig'}“ gestellt, damit das Spiel flüssig läuft. Ändern kannst du das in den Einstellungen.`); } }
function applyQuality(){
  const q = SET.quality, dpr = window.devicePixelRatio||1;
  renderer.setPixelRatio(q==='niedrig' ? 1 : q==='mittel' ? Math.min(dpr,1.5) : Math.min(dpr,2));
  const sh = q==='hoch';
  if (renderer.shadowMap.enabled !== sh){ renderer.shadowMap.enabled = sh; shadowLights.forEach(L=>L.castShadow=sh); scene.traverse(o=>{ if (o.material){ (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>m.needsUpdate=true); } }); }
  shadowLights.forEach(L=>L.castShadow=sh); renderer.shadowMap.needsUpdate=true;
  resize();
}

function updateDoors(dt){
  const near = (x,z,r)=> Math.hypot(P.x-x, P.z-z) < r || customers.some(c=>c.state!=='gone' && Math.hypot(c.g.position.x-x, c.g.position.z-z) < r);
  let nearest=null, nd=99; const cand=[[P.x,P.z,1.15]].concat(customers.filter(c=>c.state!=='gone').map(c=>[c.g.position.x,c.g.position.z,2.3])); if (courierP.visible) cand.push([courierP.position.x,courierP.position.z,2.3]);
  for (const [x,z,r] of cand){ const d=Math.hypot(x-0,(z-4.1)*1.15); if (d<r && d<nd){ nd=d; nearest=[x,z]; } }
  if (nearest && Math.abs(doorAngle) < 0.04) doorDir = nearest[1] < 4.1 ? -1 : 1; // Richtung nur beim Öffnen festlegen, bis die Tür wieder zu ist
  const tgt = nearest ? 1.4*doorDir : 0; doorAngle += (tgt-doorAngle)*Math.min(1,dt*7); doorGroup.rotation.y = doorAngle;
  const gt = (Math.hypot(P.x-6,P.z-12.1)<2.2) ? 1 : 0; ghDoorOpen += (gt-ghDoorOpen)*Math.min(1,dt*6);
  lid.rotation.x += (lidTarget-lid.rotation.x)*Math.min(1,dt*6);
  ghDoorL.position.x = 5.6 - ghDoorOpen*0.78; ghDoorR.position.x = 6.4 + ghDoorOpen*0.78; ghDoorFrameL.position.x = ghDoorL.position.x; ghDoorFrameR.position.x = ghDoorR.position.x;
}
let frameErr=0;
function frame(now){ try { frameInner(now); } catch(e){ console.error(e); if (++frameErr===1) try { toast('Kleiner Fehler im Spiel – es läuft weiter. Falls etwas hakt: Spiel speichern und neu laden.','bad'); } catch(_){} requestAnimationFrame(frame); } }
function frameInner(now){
  const dt = Math.min(0.05, (now-last)/1000); last = now; perfWatch(dt);
  if (mode==='menu'){
    menuT += dt;
    const a = menuT*0.08;
    camera.position.set(-0.2 + Math.sin(a)*2.2, 1.75 + Math.sin(menuT*0.3)*0.08, 1.4 + Math.cos(a)*1.2);
    camera.lookAt(-1.2 + Math.sin(a*0.7)*1.5, 1.05, -1.6);
    updateDoors(dt);
  } else {
    if (!paused){
      let fx=0, fz=0;
      if (keys.KeyW||keys.ArrowUp) fz-=1; if (keys.KeyS||keys.ArrowDown) fz+=1; if (keys.KeyA||keys.ArrowLeft) fx-=1; if (keys.KeyD||keys.ArrowRight) fx+=1;
      fx += joyV.x; fz += joyV.y;
      const len = Math.hypot(fx,fz); if (len>1){ fx/=len; fz/=len; }
      const joyFull = Math.hypot(joyV.x,joyV.y) > 0.9; const sp = (keys.ShiftLeft||keys.ShiftRight||joyFull ? 5.0 : 3.4)*dt;
      const s=Math.sin(P.yaw), c=Math.cos(P.yaw);
      if (P.seat){ if (len>0.35) standUp(); } else [P.x,P.z] = collide(P.x + (fx*c + fz*s)*sp, P.z + (-fx*s + fz*c)*sp);
      if (len>0.1 && !P.seat) bob += dt*9;
      if (Coop.role!=='client'){ // im Koop simuliert nur der Host die Welt
      S.minute += dt*timeScale();
      if (S.minute >= closeH()*60 && S.open){ closeShop(); toast(`${closeH()} Uhr – Ladenschluss. Wer drin ist, wird noch bedient. Um Mitternacht beginnt ein neuer Tag.`); }
      updateTourn(); updateTrade(); updateInspect(dt); updateCarry(); updateCarryDeco(); updateDw(); if (S.open && S.upg && S.upg.staff) S.staffHours=(S.staffHours||0)+dt*timeScale()/60; updateStaff(dt); updateRain(dt);
      if (S.minute >= 24*60) newDay();
      updateCustomers(dt); updateBrew(dt); checkGrading(); updateOnline(dt);
      if (S.minute >= 16*60 && S.pickedDay !== S.day){ S.pickedDay = S.day; courierPickup(); }
      updateCourier(dt);
      }
    }
    updateDoors(dt);
    camera.position.set(P.x, P.seat ? 1.12 : 1.62 + (SET.bob ? Math.sin(bob)*0.022 : 0), P.z);
    camera.rotation.set(0,0,0); camera.rotateY(P.yaw); camera.rotateX(P.pitch);
    if (heldMesh) heldMesh.position.y = SET.bob ? Math.sin(bob*0.5)*0.006 : 0;
    if (!paused) updateFocus();
    hudT -= dt; if (hudT<=0){ hudT=0.25; updateHud(); }
  }
  if (_ovPrevP){ P=_ovPrevP; _ovPrevP=null; } Coop.update(dt); updateAnims(dt); updateTermHint(dt); if ((frame._dn=(frame._dn||0)+1)%20===0) updateDayNight();
  if (renderer.shadowMap.enabled && ++shadowTick%12===0) renderer.shadowMap.needsUpdate=true; // Schatten nur alle 12 Bilder neu (Raum ist statisch)
  renderer.render(scene, camera);
  if (SET.fps){ fpsN++; fpsAcc+=now-(frame._l||now); frame._l=now; if (fpsAcc>=500){ fpsEl.textContent=`${Math.round(fpsN*1000/fpsAcc)} FPS · ${renderer.info.render.calls} Draw Calls`; fpsN=0; fpsAcc=0; } }
  requestAnimationFrame(frame);
}

function staticMerge(){
  const dyn = new Set([...TABLES.map(T=>T.G), doorGroup, van, courierP, packBench, laptop, staffP, dekoG, neonG, ghDoorL, ghDoorR, ghDoorFrameL, ghDoorFrameR, clerk, rain, heldGroup, bonMesh].concat(jarCookies));
  scene.updateMatrixWorld(true); const groups=new Map(); const tmp=new THREE.Vector3();
  scene.traverse(o=>{ if (!o.isMesh) return;
    if (o.castShadow){ if (!o.geometry.boundingSphere) o.geometry.computeBoundingSphere(); o.getWorldScale(tmp); if (o.geometry.boundingSphere.radius*Math.max(tmp.x,tmp.y,tmp.z) < 0.12) o.castShadow=false; }
    let a=o, ok=true; while (a && a!==scene){ if (dyn.has(a) || a.userData.inter || a.userData.customer || !a.visible || a.renderOrder) { ok=false; break; } a=a.parent; } if (!ok || !a) return;
    const m=o.material; if (Array.isArray(m) || m.transparent || !o.geometry.attributes.position || !o.geometry.attributes.normal || o.isInstancedMesh) return;
    const key=m.uuid+'|'+(o.castShadow?1:0)+(o.receiveShadow?1:0); if (!groups.has(key)) groups.set(key,{ m, cast:o.castShadow, recv:o.receiveShadow, list:[] }); groups.get(key).list.push(o); });
  let merged=0, made=0;
  groups.forEach(G=>{ if (G.list.length<2) return; let n=0;
    const geos=G.list.map(o=>{ const g=(o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone()); g.applyMatrix4(o.matrixWorld); if (o.matrixWorld.determinant()<0){ for (const at of ['position','normal','uv']){ const A=g.attributes[at]; if (!A) continue; const s=A.itemSize, arr=A.array; for (let t=0;t<A.count;t+=3){ for (let k=0;k<s;k++){ const i1=(t+1)*s+k, i2=(t+2)*s+k, v=arr[i1]; arr[i1]=arr[i2]; arr[i2]=v; } } } } n+=g.attributes.position.count; return g; });
    const pos=new Float32Array(n*3), nor=new Float32Array(n*3), uv=new Float32Array(n*2); let off=0;
    geos.forEach(g=>{ const c=g.attributes.position.count; pos.set(g.attributes.position.array, off*3); nor.set(g.attributes.normal.array, off*3); if (g.attributes.uv) uv.set(g.attributes.uv.array, off*2); off+=c; g.dispose(); });
    const bg=new THREE.BufferGeometry(); bg.setAttribute('position',new THREE.BufferAttribute(pos,3)); bg.setAttribute('normal',new THREE.BufferAttribute(nor,3)); bg.setAttribute('uv',new THREE.BufferAttribute(uv,2)); bg.computeBoundingSphere();
    const mesh=new THREE.Mesh(bg,G.m); mesh.castShadow=G.cast; mesh.receiveShadow=G.recv; mesh.matrixAutoUpdate=false; mesh.raycast=()=>{}; scene.add(mesh); made++;
    G.list.forEach(o=>o.parent.remove(o)); merged+=G.list.length; });
  return [merged, made];
}
window.__merge = staticMerge();

const NIGHT = { mats:[], last:-1 };
{ const v=new THREE.Vector3(); scene.traverse(o=>{ if (!o.isMesh || !o.material) return; if (!o.geometry.boundingSphere) o.geometry.computeBoundingSphere(); v.copy(o.geometry.boundingSphere.center).applyMatrix4(o.matrixWorld); (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{ if (m===fridgeIn || !(m.emissiveIntensity>0.12) || !m.emissive || (m.emissive.r+m.emissive.g+m.emissive.b)<0.05) return; if (!NIGHT.mats.some(e=>e.m===m)) NIGHT.mats.push({ m, base:m.emissiveIntensity, col:m.color.clone() }); }); }); }
const DAY_SKY=['#5f8fc4','#a9c7e2','#e8dcc8'], DUSK_SKY=['#2a3a6a','#c87a5a','#f0b070'], NIGHT_SKY=['#070b1c','#16224a','#2a2a40'];
function mixHex(a,b,t){ const pa=parseInt(a.slice(1),16), pb=parseInt(b.slice(1),16); const r=Math.round(((pa>>16)&255)*(1-t)+((pb>>16)&255)*t), g=Math.round(((pa>>8)&255)*(1-t)+((pb>>8)&255)*t), bl=Math.round((pa&255)*(1-t)+(pb&255)*t); return '#'+((1<<24)+(r<<16)+(g<<8)+bl).toString(16).slice(1); }
function dayLight(){ const h=(S.minute/60)%24; if (h>=7.5 && h<17) return 1; if (h>=17 && h<20.5) return 1-(h-17)/3.5; if (h>=5 && h<7.5) return (h-5)/2.5; return 0; }
function updateDayNight(force){ const L=dayLight(); if (!force && Math.abs(L-NIGHT.last)<0.01) return; NIGHT.last=L; const k=0.08+0.92*L; cafeHemi.intensity=0.22+0.28*L; scene.fog.near=28*L+9*(1-L); scene.fog.far=70*L+42*(1-L);
  const ck=0.3+0.7*L; NIGHT.mats.forEach(e=>{ e.m.emissiveIntensity=e.base*k; e.m.color.copy(e.col).multiplyScalar(ck); }); street.material.emissiveIntensity=0.42*k;
  const dusk = L<1 && L>0 ? Math.sin(L*Math.PI) : 0; const sky = i=>mixHex(mixHex(NIGHT_SKY[i],DAY_SKY[i],L), DUSK_SKY[i], dusk*0.6);
  const x=skyCv.getContext('2d'); const g=x.createLinearGradient(0,0,0,256); g.addColorStop(0,sky(0)); g.addColorStop(.6,sky(1)); g.addColorStop(1,sky(2)); x.fillStyle=g; x.fillRect(0,0,4,256); skyTex.needsUpdate=true; scene.fog.color.set(mixHex('#1a2238','#b8cde0',L));
  const n=1-L; halos.forEach(([s,p])=>{ s.material.opacity=n*0.95; p.material.opacity=n*0.55; }); winGlow.forEach(m=>m.material.opacity=n*0.22); }
